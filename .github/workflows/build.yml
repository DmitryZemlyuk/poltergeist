name: Build

on:
  push:
    branches: [main, "wip/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 26 SDK: the app gets Liquid Glass on Tahoe and still runs on macOS 14+.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Unit tests
        run: swift test
      - name: Build universal app
        run: tools/bundle.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/*.zip

  release:
    # Every push to main publishes (or refreshes) the release for the version in VERSION.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Poltergeist ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            Universal macOS app (Apple Silicon and Intel), macOS 14 or later.
            Unpack the `.zip` and move Poltergeist to Applications. First launch: right-click → Open (the app is not notarized).
            For the full scan, allow Full Disk Access in System Settings → Privacy & Security.
      - name: Keep only the three newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | sort -V -r | tail -n +4 \
            | while read -r tag; do
                echo "Deleting old release $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
